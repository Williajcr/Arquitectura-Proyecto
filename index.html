<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Banco Accesible</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="#main" class="skip-link">Saltar al contenido principal</a>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="index.html">🏦 Banco Accesible</a>
      </div>
    </nav>
  </header>

  <main id="main" class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <h1 class="mb-4">Iniciar sesión</h1>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="usuario" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="usuario" name="usuario"
                   required autocomplete="username">
            <div class="invalid-feedback">Por favor ingrese su usuario.</div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password"
                   required autocomplete="current-password">
            <div class="invalid-feedback">Por favor ingrese su contraseña.</div>
          </div>

          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="mostrarPassword">
            <label class="form-check-label" for="mostrarPassword">Mostrar contraseña</label>
          </div>

          <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>

        <div id="mensajeError" class="alert alert-danger mt-3" role="alert" hidden></div>

        <p class="text-muted mt-3 small">
          Credenciales de prueba: <strong>cliente</strong> / <strong>1234</strong>
        </p>
      </div>
    </div>
  </main>

  <footer class="bg-light text-center py-3 mt-5">
    <div class="container">
      <p class="mb-0">© 2025 Banco Accesible. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
